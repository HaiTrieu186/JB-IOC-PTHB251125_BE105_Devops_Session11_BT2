services:
  api-gateway:
    image: ghcr.io/${GITHUB_OWNER}/api-gateway:latest
    ports:
      - "127.0.0.1:${GATEWAY_PORT}:8080"
    environment:
      - CUSTOMER_SERVICE_HOST=${CUSTOMER_SERVICE_HOST}
    depends_on:
      - customer-service
    networks:
      - ecommerce-net

  customer-service:
    image: ghcr.io/${GITHUB_OWNER}/customer-service:latest
    networks:
      - ecommerce-net

networks:
  ecommerce-net:
    driver: bridge